<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Products | FocalPoint</title>
  <meta name="description" content="FocalPoint sells cameras, lenses and studio gear in Kigali, Rwanda.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231c1a17'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23c23a24'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Mono&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body data-page="admin" data-root="../">
  <div id="site-header"></div>

  <main>
    <div class="container page-head admin-head">
      <div>
        <h1>Manage products</h1>
        <p id="admin-count"></p>
      </div>
      <a class="btn btn--accent" href="product-form.html">Add product</a>
    </div>

    <section class="container" aria-label="Products">
      <div id="admin-message"></div>
      <div id="admin-products"></div>
    </section>

    <dialog class="dialog" id="delete-dialog" aria-labelledby="delete-title">
      <h2 id="delete-title">Delete this product?</h2>
      <p><strong id="delete-name"></strong> will be removed from the shop. This cannot be undone.</p>
      <div class="dialog__actions">
        <button class="btn btn--outline" id="delete-cancel" type="button" autofocus>Keep product</button>
        <button class="btn btn--danger" id="delete-confirm" type="button">Delete product</button>
      </div>
    </dialog>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/pages/admin-list.js"></script>
</body>
</html>
