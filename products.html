<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop All Products | FocalPoint</title>
  <meta name="description" content="FocalPoint sells cameras, lenses and studio gear in Kigali, Rwanda.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231c1a17'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23c23a24'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Mono&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="products">
  <div id="site-header"></div>

  <main>
    <div class="container page-head">
      <h1>Shop all gear</h1>
      <p>Find the right camera, lens or accessory for the way you work.</p>
    </div>

    <section class="container shop" aria-label="Products">
      <form class="shop-toolbar" id="shop-toolbar" role="search">
        <div class="shop-toolbar__search">
          <label class="sr-only" for="shop-search">Search products</label>
          <input id="shop-search" type="search" placeholder="Search by name or description">
        </div>
        <div class="shop-toolbar__sort">
          <label for="shop-sort">Sort by</label>
          <select id="shop-sort">
            <option value="default">Featured</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="name">Name: A to Z</option>
          </select>
        </div>
        <div class="chips" id="shop-categories" role="group" aria-label="Filter by category"></div>
      </form>

      <p class="shop-count" id="shop-count" role="status"></p>
      <div class="product-grid" id="shop-results"></div>
      <div class="empty-state" id="shop-empty" hidden>
        <h2>No products found</h2>
        <p>Try a different search or browse every category.</p>
        <button class="btn btn--outline" id="shop-clear" type="button">Clear search and filters</button>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/products.js"></script>
</body>
</html>
