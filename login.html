<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | FocalPoint</title>
  <meta name="description" content="FocalPoint sells cameras, lenses and studio gear in Kigali, Rwanda.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231c1a17'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23c23a24'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Mono&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="login">
  <div id="site-header"></div>

  <main>
    <section class="container login">
      <div class="login__card">
        <h1>Admin login</h1>
        <p class="login__lead">Log in to add, edit and delete products.</p>
        <div id="login-message"></div>

        <form id="login-form" novalidate>
          <div class="field" data-field="username">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="username-error">
            <p class="field__error" id="username-error" hidden></p>
          </div>

          <div class="field" data-field="password">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-error">
            <p class="field__error" id="password-error" hidden></p>
          </div>

          <button class="btn btn--accent btn--block" type="submit">Log in</button>
        </form>

        <p class="login__hint">Demo login: username <code>admin</code>, password <code>admin123</code></p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/login.js"></script>
</body>
</html>
